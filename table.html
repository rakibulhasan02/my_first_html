<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table{
            border-collapse: collapse;
            background-color: lightgray;
            width: 50%;
        }
        th,td{
            border: 2px black solid;
            padding: 10px 20px;
        }
        caption{
            text-decoration: underline;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Friends</h2>
    <table>
        <caption>
            Friends info
        </caption>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <td>Priya</td>
                <td>Sharma</td>
                <td>26</td>
            </tr>
            <tr>
                <td>Arun</td>
                <td>Singh</td>
                <td>32</td>
            </tr>
            <tr>
                <td>Sam</td>
                <td>Watson</td>
                <td>33</td>
            </tr>
        </tbody>
        <tfoot>
         <td colspan="2"> Average age: </td>  
         <td>30.33</td>
        </tfoot>
    </table>
    <section>
        <h2>Table info</h2>
        <ul>
            <li>Table: table</li>
            <li>table head: thead</li>
            <li>table body: tbody</li>
            <li>table foot: tfoot</li>
            <li>table row: tr</li>
            <li>table data: td</li>
            <li>th</li>
        </ul>

    </section>
</body>
</html>
